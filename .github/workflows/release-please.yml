name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

    steps:
      - name: Validate release token configuration
        run: |
          if [ -n "${RELEASE_PLEASE_TOKEN}" ]; then
            echo "Using configured RELEASE_PLEASE_TOKEN."
            exit 0
          fi

          echo "::error title=Release Please token missing::RELEASE_PLEASE_TOKEN is not configured. This repository currently cannot rely on GITHUB_TOKEN to create pull requests unless Actions settings explicitly allow it. Add a repository secret named RELEASE_PLEASE_TOKEN or enable 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General > Workflow permissions."
          exit 1

      - name: Run Release Please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
